<!doctype html>
<html>
  <head>
    <style>
      body {
        font-family: Arial;
        padding: 6px;
        width: 300px;
      }
      button {
        width: 100%;
      }
      input,
      textarea {
        box-sizing: border-box;
      }
      .section {
        margin-bottom: 10px;
      }
      label {
        display: block;
        margin: 4px 0;
      }
      .extract_btn {
        background-color: #4caf50;
        color: white;
        border: none;
        padding: 20px 10px;
        cursor: pointer;
      }
      .status {
        margin-top: 8px;
        font-size: 12px;
        line-height: 1.4;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .hint {
        color: #555;
        font-size: 11px;
        line-height: 1.35;
        margin-top: 4px;
        word-break: break-word;
      }
      .error {
        color: #b00020;
      }
      .version-info {
        color: #555;
        font-size: 11px;
        margin: 0 0 8px;
      }
    </style>
  </head>
  <body>
    <button id="extractBtn" class="extract_btn">EXTRACT</button>

    <div class="section">
      <p id="versionInfo" class="version-info"></p>
      <strong>Target Tabs</strong>
      <label>
        <input type="radio" name="target" value="currentTab" checked />
        Current tab
      </label>
      <label>
        <input type="radio" name="target" value="currentWindow" />
        All tabs in current window
      </label>
    </div>

    <div class="section">
      <strong>Content Scope</strong>
      <label>
        <input type="radio" name="scope" value="article" />
        Article (Readability)
      </label>
      <label>
        <input type="radio" name="scope" value="full" checked />
        Full Page (DOM)
      </label>
    </div>

    <div class="section">
      <strong>Output Format</strong>
      <label>
        <input type="radio" name="format" value="html" />
        HTML
      </label>
      <label>
        <input type="radio" name="format" value="text" checked />
        Text
      </label>
    </div>

    <div class="section">
      <strong>File Name Settings</strong>

      <label>
        Base Name:
        <input
          type="text"
          id="baseName"
          placeholder="Base name for file (without extension)"
          style="width: 100%"
        />
      </label>

      <label>
        Next Serial Number:
        <input
          type="number"
          id="serialNumber"
          min="1"
          step="1"
          style="width: 100%"
        />
      </label>

      <label>
        Folder under Downloads:
        <input
          type="text"
          id="downloadFolderPath"
          placeholder="products/20_09_2026"
          style="width: 100%"
        />
      </label>

      <div id="destinationPreview" class="hint"></div>
    </div>

    <div class="section">
      <strong>Notes / Header Text</strong>
      <textarea
        id="userText"
        rows="4"
        style="width: 100%; resize: vertical"
        placeholder="Type text to include at top of file..."
      ></textarea>
    </div>

    <div id="status" class="status" aria-live="polite"></div>

    <script src="shared.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
